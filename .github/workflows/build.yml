name: Build Windows  
  
on:  
  push:  
    branches: [main, master]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Rust toolchain  
        uses: dtolnay/rust-toolchain@stable  
        with:  
          targets: i686-pc-windows-msvc  
  
      - name: Build release  
        run: cargo build --release --target i686-pc-windows-msvc  
  
      - name: Copy DLL to output folder  
        run: copy /Y library\acid64pro.dll target\i686-pc-windows-msvc\release\acid64pro.dll  
  
      - name: Copy HardSID DLL to output folder  
        run: copy /Y library\hardsid_usb.dll target\i686-pc-windows-msvc\release\hardsid_usb.dll  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: acid64c-win10-x86  
          path: |  
            target/i686-pc-windows-msvc/release/acid64c.exe  
            target/i686-pc-windows-msvc/release/acid64pro.dll  
            target/i686-pc-windows-msvc/release/hardsid_usb.dll
