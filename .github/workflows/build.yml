name: Build Windows  
  
on:  
  push:  
    branches: [main, master]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Rust toolchain  
        uses: dtolnay/rust-toolchain@stable  
        with:  
          targets: i686-pc-windows-msvc  
  
      - name: Build release  
        run: cargo build --release --target i686-pc-windows-msvc  
  
      - name: Sniff output directory  
        run: Get-ChildItem -Path target -Recurse -Filter *.dll | Select-Object FullName  
  
      - name: Sniff release directory contents  
        run: Get-ChildItem -Path target\i686-pc-windows-msvc\release  
  
      - name: Sniff exe location  
        run: Get-ChildItem -Path target -Recurse -Filter acid64c.exe | Select-Object FullName  
  
      - name: Copy acid64pro.dll  
        run: Copy-Item -Path library\acid64pro.dll -Destination target\i686-pc-windows-msvc\release\acid64pro.dll -Force  
  
      - name: Copy hardsid_usb.dll  
        run: Copy-Item -Path library\hardsid_usb.dll -Destination target\i686-pc-windows-msvc\release\hardsid_usb.dll -Force  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: acid64c-win10-x86  
          path: |  
            target/i686-pc-windows-msvc/release/acid64c.exe  
            target/i686-pc-windows-msvc/release/acid64pro.dll  
            target/i686-pc-windows-msvc/release/hardsid_usb.dll
